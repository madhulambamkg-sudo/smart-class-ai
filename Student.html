<!DOCTYPE html>
<html>
<head>
<title>Student Check-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #f3f4f6;
  text-align: center;
  padding: 50px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
}

button {
  padding: 10px 20px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Student Check-in</h2>

  <input type="text" placeholder="Enter Name">
  <input type="text" placeholder="Class / Section">

  <button onclick="alert('Successfully Joined!')">Join Class</button>
</div>

</body>
</html>
